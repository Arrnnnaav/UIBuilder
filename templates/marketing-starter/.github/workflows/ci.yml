name: Site CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:tokens
      - run: pnpm validate:content
      - run: pnpm test
      - run: pnpm audit --audit-level high
      - name: Clean production build
        run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Production SEO and performance
        run: |
          pnpm start --port 3000 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:3000/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          pnpm seo:audit http://localhost:3000
          pnpm perf http://localhost:3000
      - name: Require committed Linux visual baselines
        run: |
          test -n "$(git ls-files 'e2e/__snapshots__/linux/*.png' 'e2e/__snapshots__/linux/**/*.png')"
      - name: Build dedicated browser test artifact
        run: pnpm build
        env:
          E2E_ERROR_ROUTE: "1"
          CONTACT_DRY_RUN: "1"
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      - name: Compare browser tests against reviewed baselines
        run: pnpm test:e2e --update-snapshots=none
        env:
          E2E_SKIP_BUILD: "1"
          E2E_ERROR_ROUTE: "1"
          CONTACT_DRY_RUN: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            playwright-report
            test-results
            .lighthouse

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Semgrep Community Edition
        run: node scripts/check-security-rules.mjs
      - name: Full site scan with Semgrep Community Edition
        run: >-
          docker run --rm
          --mount type=bind,source="$GITHUB_WORKSPACE",target=/src,readonly
          semgrep/semgrep@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
          semgrep scan --config /src/security/semgrep --error --metrics=off /src

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks full-history scan (redacted output)
        run: >-
          docker run --rm
          --mount type=bind,source="$GITHUB_WORKSPACE",target=/repo,readonly
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner /repo
