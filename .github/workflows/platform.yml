name: Platform contracts
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/validate-brain.mjs
      - run: node scripts/validate-contracts.mjs
      - run: node --test tests/platform/*.test.mjs
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Semgrep Community Edition
        run: node scripts/check-security-rules.mjs
      - name: Full harness scan with Semgrep Community Edition
        run: >-
          docker run --rm
          --mount type=bind,source="$GITHUB_WORKSPACE",target=/src,readonly
          semgrep/semgrep@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
          semgrep scan --config /src/security/semgrep --error --metrics=off /src
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks full-history scan (redacted output)
        run: >-
          docker run --rm
          --mount type=bind,source="$GITHUB_WORKSPACE",target=/repo,readonly
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner /repo
