name: Platform contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/validate-brain.mjs
      - run: node scripts/validate-contracts.mjs
      - run: node --test tests/platform/*.test.mjs
