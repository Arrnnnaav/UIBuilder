name: Site source quality
on:
  push:
    branches: [main]
    paths: ['projects/**', '.github/workflows/sites.yml']
  pull_request:
    paths: ['projects/**', '.github/workflows/sites.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sites-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portfolio-static-snapshots:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: projects/portfolio/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: projects/portfolio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Generate Linux static-candidate visual baselines
        run: pnpm test:e2e -- --grep 'matches the visual snapshot' --update-snapshots=all --reporter=line
        env:
          E2E_PORT: "3107"
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-linux-static-snapshots
          path: projects/portfolio/e2e/__snapshots__/linux/
          if-no-files-found: error
          retention-days: 2

  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        site: [portfolio, demo, abizcreator]
    defaults:
      run:
        working-directory: projects/${{ matrix.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: projects/${{ matrix.site }}/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: projects/${{ matrix.site }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:tokens
      - run: pnpm validate:content
      - run: pnpm test
      - run: pnpm audit --audit-level high
      - run: pnpm build
